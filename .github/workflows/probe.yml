name: 探针（临时）

on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 探测 Models API 各端点
        env:
          T: ${{ secrets.GITHUB_TOKEN }}
        run: |
          probe() {
            echo "===== $1 ====="
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 60 "${@:2}")
            echo "HTTP $code  bytes=$(wc -c < /tmp/body)"
            head -c 400 /tmp/body; echo; echo
          }

          probe "A: models.github.ai + gpt-4o-mini" \
            -X POST "https://models.github.ai/inference/chat/completions" \
            -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
            -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"What is 2+2? Only the number."}]}'

          probe "B: models.github.ai + openai/gpt-4o-mini" \
            -X POST "https://models.github.ai/inference/chat/completions" \
            -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
            -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"What is 2+2? Only the number."}]}'

          probe "C: azure 旧端点" \
            -X POST "https://models.inference.ai.azure.com/chat/completions" \
            -H "Authorization: Bearer $T" -H "Content-Type: application/json" \
            -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"What is 2+2? Only the number."}]}'

          probe "D: catalog/models GET" \
            "https://models.github.ai/catalog/models" \
            -H "Authorization: Bearer $T"

          echo "===== E: 直接访问根路径 ====="
          curl -s -i --max-time 30 "https://models.github.ai/" -H "Authorization: Bearer $T" | head -8
