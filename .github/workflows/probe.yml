name: 探针（临时）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 探测免费翻译服务
        run: |
          t() {
            echo "===== $1 ====="
            code=$(curl -s -o /tmp/b -w "%{http_code}" --max-time 25 "${@:2}" 2>/dev/null || echo "ERR")
            echo "HTTP $code  bytes=$(wc -c < /tmp/b 2>/dev/null || echo 0)"
            head -c 350 /tmp/b 2>/dev/null; echo; echo
          }

          t "1 google gtx" "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=zh-TW&dt=t&q=hello%20world"

          t "2 mymemory" "https://api.mymemory.translated.net/get?q=hello%20world&langpair=en|zh-TW"

          t "3 lingva.ml" "https://lingva.ml/api/v1/en/zh/hello%20world"

          t "4 libretranslate terraprint" -X POST "https://translate.terraprint.co/translate" \
            -H "Content-Type: application/json" \
            -d '{"q":"hello world","source":"en","target":"zh"}'

          t "5 bing free" "https://api-edge.cognitive.microsofttranslator.com/translate?api-version=3.0&to=zh-Hant&from=en" \
            -H "Content-Type: application/json" \
            -d '[{"Text":"hello world"}]'

          echo "===== done ====="
