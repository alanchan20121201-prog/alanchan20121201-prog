name: 探针（临时）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 探测 ModelScope API 连通性与延迟
        run: |
          t() {
            echo "===== $1 ====="
            out=$(curl -s -o /tmp/b -w "%{http_code} %{time_total}s" --max-time 25 "${@:2}" 2>/dev/null || echo "CONN_FAIL")
            echo "HTTP/time: $out"
            head -c 300 /tmp/b 2>/dev/null; echo; echo
          }

          t "1 ModelScope /v1/models" "https://api-inference.modelscope.cn/v1/models"

          t "2 ModelScope chat 无 token" -X POST "https://api-inference.modelscope.cn/v1/chat/completions" \
            -H "Content-Type: application/json" \
            -d '{"model":"Qwen/Qwen3.5-27B","messages":[{"role":"user","content":"hi"}]}'

          t "3 硅基流动对照" "https://api.siliconflow.cn/v1/models"

          echo "===== done（401 = 可达）====="
