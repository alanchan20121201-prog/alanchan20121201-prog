name: 探针（临时）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 测真实描述翻译质量
        run: |
          tr_test() {
            echo "===== $1 => $2 ====="
            q=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$3")
            curl -s --max-time 25 "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=$2&dt=t&q=$q" \
              | python3 -c "import json,sys;d=json.load(sys.stdin);print(''.join(s[0] for s in d[0] if s and s[0]))" 2>/dev/null || echo "FAIL"
            echo
          }

          ZH="把一句话像水印一样刻在桌面上，永远置顶、鼠标穿透的 Windows 小工具（.NET 8 + WPF）"
          tr_test "GhostNote中文" "en" "$ZH"
          tr_test "GhostNote中文" "ja" "$ZH"
          tr_test "GhostNote中文" "zh-TW" "$ZH"

          EN="A frameless, transparent floating countdown / stopwatch / Pomodoro timer for Windows. Four display modes, four languages, in-app updates."
          tr_test "nanotimer英文" "zh-CN" "$EN"
          tr_test "nanotimer英文" "ja" "$EN"
          tr_test "nanotimer英文" "zh-TW" "$EN"

          echo "===== done ====="
